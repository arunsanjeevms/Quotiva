name: Deploy frontend to GitHub Pages

# docs/09-operations.md §4 / DEPLOY.md — builds frontend/ and publishes it to
# GitHub Pages at https://<owner>.github.io/Quotiva/. The backend is deployed
# separately (Render, see render.yaml); this workflow only touches the SPA.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
          # Public values only — never a service-role key or SMTP secret here
          # (docs/09-operations.md §1). Configure these as repository
          # Settings → Secrets and variables → Actions → Variables.
          # Until a backend is deployed, VITE_ENABLE_MOCKS stays "true" so the
          # published site runs as a fully working demo against MSW.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ENABLE_MOCKS: ${{ vars.VITE_ENABLE_MOCKS || 'true' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
