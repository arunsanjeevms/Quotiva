## Render Blueprint — deploys both the Quotiva backend (Express) and frontend
## (static Vite build) as free-tier services in one project.
## docs/09-operations.md §4 / DEPLOY.md. Push this file to the repo root, then
## in Render: New → Blueprint → select this repo. Render reads this file
## automatically and creates both services below.
##
## After the first deploy, Render assigns each service a *.onrender.com URL.
## Two values below can only be filled in once you have those URLs — set them
## in the Render dashboard on each service (Environment tab), not here:
##   - quotiva-api      → APP_ORIGIN         = the frontend's URL (no trailing slash)
##   - quotiva-frontend → VITE_API_BASE_URL  = the backend's URL + "/api"
## Every var marked `sync: false` below is one you set by hand in the
## dashboard — Supabase keys and these two cross-service URLs.

services:
  - type: web
    name: quotiva-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # The frontend's Render URL once it exists, e.g. https://quotiva-frontend.onrender.com
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
      - key: LOG_LEVEL
        value: info

  - type: web
    name: quotiva-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    # Client-side routing (React Router) — every path serves index.html and
    # the router takes over from there.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The backend's Render URL once it exists, e.g. https://quotiva-api.onrender.com/api
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Leave "true" to run as a self-contained MSW-backed demo before the
      # backend/Supabase values above are filled in; set to "false" once they
      # are, so the app talks to the real API and real Supabase Auth.
      - key: VITE_ENABLE_MOCKS
        value: 'true'
