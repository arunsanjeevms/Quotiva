<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quotiva</title>
    <!--
      GitHub Pages has no server-side rewrites, so a deep link (e.g.
      /Quotiva/invoices/123) or a hard refresh on one hits this 404 page
      instead of index.html. This encodes the real path into a query string
      and redirects to the app root; index.html's matching script decodes it
      and hands the real URL to the router before React mounts, so the user
      never sees a flash of the wrong page. Standard technique:
      https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var segmentCount = 1; // path segments to treat as the base (/Quotiva/)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
